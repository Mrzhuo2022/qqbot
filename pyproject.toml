[project]
name = "qqbot"
version = "0.1.0"
description = "个人定制化 QQ 群聊机器人：NapCat + OneBot 11 + NoneBot2 + LLM"
requires-python = ">=3.10"
dependencies = [
    "nonebot2[fastapi]>=2.4.0",
    "nonebot-adapter-onebot>=2.4.0",
    "openai>=1.60.0",
    "httpx>=0.27.0",
    "trafilatura>=2.0.0",
    "yt-dlp>=2025.1.15",
    "nonebot-plugin-apscheduler>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# F 未用变量/未定义名，E4/E7/E9 语法与缩进错误，I 导入排序，
# B 常见 bug 模式，UP 过时写法，RUF ruff 专属检查
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]
ignore = [
    # nonebot 依赖注入靠函数默认参数（args: Message = CommandArg()），是框架惯例
    "B008",
    # 全角标点：注释/文档是中文，全角逗号句号是正常书写
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# bot.py 先 nonebot.init 再导入；apscheduler 插件先 require() 再导入，都是刻意的
"bot.py" = ["E402"]
"src/plugins/group_digest/__init__.py" = ["E402"]
"src/plugins/daily_news/__init__.py" = ["E402"]
"src/plugins/ainews/__init__.py" = ["E402"]
"src/plugins/hndaily/__init__.py" = ["E402"]
"src/plugins/rank/__init__.py" = ["E402"]
"src/plugins/remind/__init__.py" = ["E402"]
"src/plugins/video_parser/__init__.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

